    - fNSigTpcTofPi0
    - fNSigTpcTofKa1
    - fNSigTpcTofPi2
    - fNSigTpcTofPr2

  hyper_par:
    - {max_depth: 4, learning_rate: 0.07, n_estimators: 600, min_child_weight: 5, subsample: 0.6, colsample_bytree: 0.75, gamma: 1.3, reg_lambda: 10, reg_alpha: 2}
    - {max_depth: 3, learning_rate: 0.06, n_estimators: 900, min_child_weight: 3, subsample: 0.65, colsample_bytree: 0.76, gamma: 1.1, reg_lambda: 5, reg_alpha: 8}
    - {max_depth: 5, learning_rate: 0.05, n_estimators: 800, min_child_weight: 7, subsample: 0.61, colsample_bytree: 0.69, gamma: 0.86, reg_lambda: 6, reg_alpha: 1}
    - {max_depth: 4, learning_rate: 0.08, n_estimators: 700, min_child_weight: 4, subsample: 0.63, colsample_bytree: 0.72, gamma: 1.0, reg_lambda: 7, reg_alpha: 3}
    - {max_depth: 6, learning_rate: 0.04, n_estimators: 1000, min_child_weight: 6, subsample: 0.58, colsample_bytree: 0.74, gamma: 1.2, reg_lambda: 9, reg_alpha: 4}
    - {max_depth: 3, learning_rate: 0.09, n_estimators: 500, min_child_weight: 2, subsample: 0.67, colsample_bytree: 0.70, gamma: 0.9, reg_lambda: 4, reg_alpha: 6}
    - {max_depth: 3, learning_rate: 0.09, n_estimators: 500, min_child_weight: 2, subsample: 0.67, colsample_bytree: 0.70, gamma: 0.9, reg_lambda: 4, reg_alpha: 6}

  hyper_pars_opt:
    do_hyp_opt: True
    hyper_pars_ranges:
      max_depth: [2, 4]
      learning_rate: [0.01, 0.15]
      n_estimators: [300, 800]
      min_child_weight: [1, 10]
      subsample: [0.5, 0.9]
      colsample_bytree: [0.5, 0.9]
      gamma: [0, 2]
      reg_lambda: [1, 15]
      reg_alpha: [0, 10]
    njobs: 1
    ntrials: 5
    timeout: 3000
    niter: 20

  saved_models:
