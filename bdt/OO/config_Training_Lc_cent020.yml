data_prep:
  filt_bkg_mass: "fM < 2.2 or fM > 2.34"
  filt_prompt:    "fOriginMcRec == 1"
  filt_FD:        "fOriginMcRec == 2"
  dataset_opt: max_signal
  bkg_mult:  [10, 5, 5, 2, 1, 1, 1]
  seed_split: 42
  test_fraction: 0.3

ml:
  raw_output: False
  roc_auc_average: macro
  roc_auc_approach: ovo

  training_columns:
    - fImpactParameter0
    - fImpactParameter1
    - fImpactParameter2
    - fChi2PCA
    - fCpa
    - fCpaXY
    - fDecayLengthXY
    - fDecayLength
